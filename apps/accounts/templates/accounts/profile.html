{% extends "layouts/account.html" %}
{% load i18n %}
{% block title %}{% translate "Profile" %}{% endblock %}
{% block content %}
<h1>{% translate "Profile" %}</h1>
<p class="mt-1 text-sm text-muted">{{ user.email }}</p>
<form method="post" class="mt-6 max-w-md space-y-6">
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn btn-primary">{% translate "Save changes" %}</button>
</form>
{% endblock %}
