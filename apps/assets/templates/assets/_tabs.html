{% load i18n %}{% with n=request.resolver_match.url_name %}
<nav class="mt-5 flex gap-1 overflow-x-auto border-b border-line" aria-label="{% translate 'Assets' %}">
  <a href="{% url 'asset_list' org_slug=current_organization.slug %}" class="-mb-px whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium no-underline {% if n == 'asset_list' %}border-navy-900 text-ink{% else %}border-transparent text-muted hover:text-ink{% endif %}">{% translate "All assets" %}</a>
  <a href="{% url 'asset_faults' org_slug=current_organization.slug %}" class="-mb-px whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium no-underline {% if n == 'asset_faults' %}border-navy-900 text-ink{% else %}border-transparent text-muted hover:text-ink{% endif %}">{% translate "Fault reports" %}</a>
  <a href="{% url 'asset_setup' org_slug=current_organization.slug %}" class="-mb-px whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium no-underline {% if n == 'asset_setup' %}border-navy-900 text-ink{% else %}border-transparent text-muted hover:text-ink{% endif %}">{% translate "Locations & categories" %}</a>
</nav>{% endwith %}
