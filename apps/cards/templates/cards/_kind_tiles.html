{% load i18n qrumy %}
<fieldset>
  <legend class="form-label">{% translate "Who is the card for?" %}</legend>
  <div class="mt-2 grid grid-cols-2 gap-3">
    {% for value, label in field.field.choices %}
    <label class="kind-tile">
      <input type="radio" name="{{ field.html_name }}" value="{{ value }}" class="sr-only" {% if field.value|default:"person" == value %}checked{% endif %}>
      <span class="inline-flex size-10 items-center justify-center rounded-xl bg-canvas">{% if value == "company" %}{% icon 'building' 'size-5' %}{% else %}{% icon 'user' 'size-5' %}{% endif %}</span>
      <span><span class="block font-semibold">{{ label }}</span><span class="block text-xs text-muted">{% if value == "company" %}{% translate "Business, shop, restaurant" %}{% else %}{% translate "You or a team member" %}{% endif %}</span></span>
    </label>
    {% endfor %}
  </div>
</fieldset>
