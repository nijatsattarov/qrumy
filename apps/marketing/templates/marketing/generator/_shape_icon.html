{# Small pictures for the shape choices. kind: module_shape | eye_frame | eye_ball | frame #}
<svg viewBox="0 0 24 24" class="size-7" aria-hidden="true" fill="currentColor">
{% if kind == "module_shape" %}
  {% if value == "square" %}<rect x="3" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/><rect x="13" y="3" width="8" height="8" opacity=".35"/><rect x="3" y="13" width="8" height="8" opacity=".35"/>
  {% elif value == "rounded" %}<rect x="3" y="3" width="8" height="8" rx="3"/><rect x="13" y="13" width="8" height="8" rx="3"/><rect x="13" y="3" width="8" height="8" rx="3" opacity=".35"/><rect x="3" y="13" width="8" height="8" rx="3" opacity=".35"/>
  {% else %}<circle cx="7" cy="7" r="4"/><circle cx="17" cy="17" r="4"/><circle cx="17" cy="7" r="4" opacity=".35"/><circle cx="7" cy="17" r="4" opacity=".35"/>{% endif %}
{% elif kind == "eye_frame" %}
  {% if value == "square" %}<path fill-rule="evenodd" d="M3 3h18v18H3zM6 6v12h12V6z"/>
  {% elif value == "rounded" %}<path fill-rule="evenodd" d="M8 3h8a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5zm0 3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/>
  {% else %}<path fill-rule="evenodd" d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm0 3a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/>{% endif %}
{% elif kind == "eye_ball" %}
  {% if value == "square" %}<rect x="6" y="6" width="12" height="12"/>
  {% elif value == "rounded" %}<rect x="6" y="6" width="12" height="12" rx="3.5"/>
  {% else %}<circle cx="12" cy="12" r="6.5"/>{% endif %}
{% else %}
  {% if value == "none" %}<rect x="5" y="5" width="14" height="14" rx="1" opacity=".9"/>
  {% elif value == "bottom" %}<rect x="5" y="2" width="14" height="13" rx="1"/><rect x="3" y="17" width="18" height="5" rx="1" opacity=".45"/>
  {% elif value == "top" %}<rect x="3" y="2" width="18" height="5" rx="1" opacity=".45"/><rect x="5" y="9" width="14" height="13" rx="1"/>
  {% else %}<rect x="5" y="2" width="14" height="13" rx="1"/><rect x="5" y="17" width="14" height="5" rx="2.5" opacity=".45"/>{% endif %}
{% endif %}
</svg>
