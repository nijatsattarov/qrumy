{% load i18n %}
{% with current=field.value|default:field.field.initial %}
<fieldset>
  <legend class="form-label">{{ field.label }}</legend>
  <div class="mt-2 flex flex-wrap gap-2">
    {% for value, label in field.field.choices %}
    <label class="shape-tile" title="{{ label }}">
      <input type="radio" name="{{ field.html_name }}" value="{{ value }}" class="sr-only" {% if current == value or not current and forloop.first %}checked{% endif %}>
      {% include "marketing/generator/_shape_icon.html" with kind=kind value=value %}
      <span class="text-[11px]">{{ label }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>
{% endwith %}
