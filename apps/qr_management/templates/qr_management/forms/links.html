{% load i18n qrumy social %}
{% for e in form.non_field_errors %}<p class="form-error">{{ e }}</p>{% endfor %}
<div class="space-y-4">
  {{ form.title.as_field_group }}
  {{ form.description.as_field_group }}
  <fieldset>
    <legend class="form-label">{{ form.accent.label }}</legend>
    <div class="mt-2 flex flex-wrap gap-2">
      {% for value, label in form.accent.field.choices %}
      <label class="accent-swatch accent-{{ value }}" title="{{ label }}">
        <input type="radio" name="{{ form.accent.html_name }}" value="{{ value }}" class="sr-only" {% if form.accent.value|default:"navy" == value %}checked{% endif %}>
        <span class="sr-only">{{ label }}</span>
      </label>
      {% endfor %}
    </div>
  </fieldset>

  {% include "qr_management/forms/_link_rows.html" %}
</div>
