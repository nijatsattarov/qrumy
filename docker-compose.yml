# Development stack: docker compose up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qrumy
      POSTGRES_USER: qrumy
      POSTGRES_PASSWORD: qrumy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrumy"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: &devenv
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://qrumy:qrumy@db:5432/qrumy
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "*"
    volumes: [".:/app", "/app/static/dist", "/app/static/vendor"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["worker"]
    environment: *devenv
    volumes: [".:/app", "/app/static/dist", "/app/static/vendor"]
    depends_on: [db, redis]
  beat:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: ["beat"]
    environment: *devenv
    depends_on: [db, redis]
volumes:
  pgdata:
