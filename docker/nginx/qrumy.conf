# Qrumy reverse proxy. TLS certs are expected at /etc/nginx/certs (see docs/DEPLOYMENT.md).
upstream qrumy_web { server web:8000; }

# Reject requests for unknown hosts (Host header spoofing, IP scans).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name qrumy.com www.qrumy.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://qrumy.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.qrumy.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 301 https://qrumy.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qrumy.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Public uploads (logos). Private files will be served via X-Accel-Redirect later.
    location /media/public/ {
        alias /srv/media/public/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }
    location /media/ { return 404; }

    # Files behind dynamic QR codes (PDF menus, images). Only reachable through the
    # app, which answers with X-Accel-Redirect after checking the code's status.
    location /protected/ {
        internal;
        alias /srv/media/private/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://qrumy_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
