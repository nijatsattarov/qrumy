{% load allauth i18n %}
<div class="form-field{% if attrs.errors %} has-error{% endif %}">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}
    <label class="flex items-center gap-2.5 text-sm" for="{{ attrs.id }}">
      <input type="{{ attrs.type }}" class="checkbox" {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.checked %}checked{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}>
      <span>{% slot label %}{% endslot %}</span>
    </label>
  {% else %}
    <label class="form-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
    {% if attrs.type == "textarea" %}
      <textarea {% if attrs.required %}required{% endif %} {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
    {% else %}
      <input type="{{ attrs.type }}" {% if attrs.required %}required{% endif %} {% if attrs.disabled %}disabled{% endif %} {% if attrs.readonly %}readonly{% endif %} {% if attrs.name %}name="{{ attrs.name }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %} {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %} {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}>
    {% endif %}
  {% endif %}
  {% if slots.help_text %}<p class="form-help">{% slot help_text %}{% endslot %}</p>{% endif %}
  {% if attrs.errors %}<div class="form-error">{{ attrs.errors }}</div>{% endif %}
</div>
