{% load allauth %}
<section class="mb-5 rounded-xl border border-line p-5">
  <h2 class="text-base font-semibold">{% slot title %}{% endslot %}</h2>
  <div class="mt-2 text-sm text-muted">{% slot body %}{% endslot %}</div>
  {% if slots.actions %}<div class="mt-4 flex flex-wrap gap-2">{% for action in slots.actions %}{{ action }}{% endfor %}</div>{% endif %}
</section>
