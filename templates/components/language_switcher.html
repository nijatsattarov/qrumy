{% load i18n qrumy %}
{% get_current_language as LANGUAGE_CODE %}{% get_available_languages as LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="inline-flex items-center gap-1.5 {{ css }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="lang-{{ id|default:'main' }}" class="sr-only">{% translate "Language" %}</label>
  {% icon 'globe' 'size-4 opacity-70' %}
  <select id="lang-{{ id|default:'main' }}" name="language" data-autosubmit
          class="cursor-pointer appearance-none bg-transparent pr-1 text-sm font-medium focus:outline-none">
    {% for code, name in LANGUAGES %}
      <option value="{{ code }}" {% if code == LANGUAGE_CODE %}selected{% endif %} class="text-ink">{% if code == 'az' %}Azərbaycanca{% else %}English{% endif %}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="btn btn-sm btn-secondary">{% translate "Change" %}</button></noscript>
</form>
